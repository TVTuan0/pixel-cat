<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#3b2f5c" />
    <meta name="description" content="Adopt a pixel kitten, look after it every day and watch it grow." />
    <title>Pixel Cat</title>

    <!-- Link preview for Messenger, Zalo, Facebook, X, Discord... -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Pixel Cat" />
    <meta property="og:title" content="Pixel Cat – raise a pixel kitten" />
    <meta property="og:description" content="Adopt a pixel kitten, look after it every day and watch it grow. Nuôi mèo pixel mỗi ngày!" />
    <meta property="og:url" content="https://pixel-cat-green.vercel.app/" />
    <meta property="og:image" content="https://pixel-cat-green.vercel.app/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="A ginger pixel cat in a party hat in a cozy pixel-art room" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="https://pixel-cat-green.vercel.app/og.png" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-title" content="Pixel Cat" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <main id="app">
      <header class="topbar">
        <div class="who">
          <span id="cat-name" class="name"></span>
          <span id="cat-age" class="age"></span>
        </div>
        <div class="coins" aria-live="polite"><span id="coin-icon"></span><span id="coins">0</span></div>
        <button id="sound-btn" class="chip" type="button"></button>
        <button id="settings-btn" class="chip icon-only" type="button"></button>
      </header>

      <section id="stats" class="stats"></section>

      <section class="stage">
        <div class="screen">
          <canvas id="room" width="160" height="120"></canvas>
          <div id="bubble" class="bubble" aria-live="polite"></div>
        </div>
      </section>

      <nav class="actions">
        <button class="action" data-action="feed" type="button"></button>
        <button class="action" data-action="play" type="button"></button>
        <button class="action" data-action="clean" type="button"></button>
        <button class="action" data-action="sleep" type="button"></button>
        <button class="action" data-action="shop" type="button"></button>
        <button class="action" data-action="share" type="button"></button>
      </nav>
    </main>

    <dialog id="sheet" class="sheet"></dialog>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
